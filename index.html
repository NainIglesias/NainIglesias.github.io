<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nain Iglesias · Backend Developer</title>
  <meta name="description" content="Nain Iglesias, desarrollador backend en Vigo especializado en Symfony, APIs REST e IA.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="hero" id="home">
    <div class="container">
      <h1>Nain Iglesias</h1>
      <p class="hero-role">Backend Developer · Symfony · IA</p>
      <div class="hero-actions">
        <a class="button" href="#projects">Ver proyectos</a>
        <a class="button button-secondary" href="#contact">Contacto</a>
      </div>
    </div>
  </header>

  <main>
    <section id="services" aria-labelledby="services-title">
      <div class="container">
        <h2 id="services-title">Qué hago</h2>
      </div>
    </section>

    <section id="about" aria-labelledby="about-title">
      <div class="container">
        <h2 id="about-title">Quién soy</h2>
      </div>
    </section>

    <section id="timeline" aria-labelledby="timeline-title">
      <div class="container">
        <h2 id="timeline-title">Trayectoria</h2>
      </div>
    </section>

    <section id="projects" aria-labelledby="projects-title">
      <div class="container">
        <h2 id="projects-title">Proyectos</h2>
        <div class="projects-grid" id="projects-list"></div>
      </div>
    </section>

    <section id="contact" aria-labelledby="contact-title">
      <div class="container">
        <h2 id="contact-title">Contacto</h2>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Nain Iglesias</p>
    </div>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
